[project]
name = "attention-finder"
version = "0.1.0"
description = "Finding the ep interaction in streaming ePIC frames and filtering background tracker hits"
readme = "README.md"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "polars>=1.0",
    "matplotlib>=3.8",
    "omegaconf>=2.3",
    "onnxruntime>=1.17",   # 5xx export checks and latency benchmarks
    "uproot>=5.3",         # 25x/6xx only: reading ePIC ROOT output
    "awkward>=2.6",        # same
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trkbkg"]
